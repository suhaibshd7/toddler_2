name: Deploy Arabic Learning Game to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - site-package.zip
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ hashFiles('site-package.zip') != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Unpack the static website
        run: |
          mkdir -p _site
          unzip -q site-package.zip -d _site
          test -s _site/index.html
          touch _site/.nojekyll

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
